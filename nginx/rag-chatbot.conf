# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy config for RAG Chatbot
# Place this file at: /etc/nginx/sites-available/rag-chatbot
# Then enable:  sudo ln -s /etc/nginx/sites-available/rag-chatbot /etc/nginx/sites-enabled/
# Reload:       sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual subdomain, e.g. rag.yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

# ── Frontend (Next.js) ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP → HTTPS (Certbot will manage this block after setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # ── SSL (managed by Certbot — fill in after running certbot) ──────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API routes → FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large PDF uploads
        client_max_body_size 50M;
        proxy_read_timeout   120s;
    }

    # ── All other routes → Next.js frontend ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
